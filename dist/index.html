<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://bintahaassociates.github.io/bintaha-crm-v2/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Bin Taha Associates — Agent Portal & Watchdog</title>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App Assets -->
    <script type="module" crossorigin src="./assets/index-DEsWyKRV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BqdMV5Bv.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Bin Taha Associates Branding & Watchdog Mobile Tracking Engine -->
    <script>
      (function() {
        const SUPABASE_URL = "https://ajrvlrvnxpatbculnwil.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ndHx-NyVhYxvDwfvBnK2iA_woPQhjJi";
        const LOGO_URL = "https://bintahaassociates.github.io/bintaha-crm-v2/logo.png";
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        // 1. برانڈنگ: صرف مین ہیڈر پر سنہری عقاب کا لوگو لگانا
        function applyBranding() {
          document.title = "Bin Taha Associates — Agent Portal";

          // صرف اوپر بائیں جانب کے مین لوگو ایریا کو منتخب کریں
          const topLogoContainer = document.querySelector('header a, nav a, header .flex.items-center:first-child');
          if (topLogoContainer && !topLogoContainer.dataset.logoDone) {
            const oldSvg = topLogoContainer.querySelector('svg');
            if (oldSvg) {
              const img = document.createElement('img');
              img.src = LOGO_URL;
              img.style.height = '42px';
              img.style.width = 'auto';
              img.style.marginRight = '10px';
              img.style.display = 'inline-block';
              img.style.objectFit = 'contain';
              img.alt = 'Bin Taha Associates';
              oldSvg.parentNode.replaceChild(img, oldSvg);
              topLogoContainer.dataset.logoDone = "true";
            }
          }

          // نام کی درستگی
          const textNodes = document.querySelectorAll('h1, h2, span');
          textNodes.forEach(node => {
            if (node.textContent.includes('Fatima')) {
              node.textContent = node.textContent.replace(/Fatima/g, 'Taha Mobeen Bhutta');
            }
          });
        }

        // 2. واچ ڈاگ موبائل و ڈیوائس ٹریکر (Watchdog Activity Logger)
        async function logWatchdogActivity(actionType, extraData = {}) {
          if (!supabase) return;

          const deviceInfo = `${navigator.userAgent} | Screen: ${window.screen.width}x${window.screen.height}`;
          let latitude = null;
          let longitude = null;

          if ("geolocation" in navigator) {
            try {
              const pos = await new Promise((res, rej) => {
                navigator.geolocation.getCurrentPosition(res, rej, { timeout: 6000 });
              });
              latitude = pos.coords.latitude;
              longitude = pos.coords.longitude;
            } catch (err) {
              // Location optional if not enabled yet
            }
          }

          try {
            await supabase.from('watchdog_logs').insert([{
              device_info: deviceInfo,
              action_type: actionType,
              latitude: latitude,
              longitude: longitude,
              details: {
                timestamp: new Date().toISOString(),
                href: window.location.href,
                ...extraData
              }
            }]);
            console.log("Watchdog data saved successfully.");
          } catch (e) {
            console.error("Watchdog logging error:", e);
          }
        }

        window.addEventListener('DOMContentLoaded', () => {
          setTimeout(applyBranding, 400);
          setInterval(applyBranding, 1500);
          logWatchdogActivity('portal_init', { user: 'Taha Mobeen Bhutta' });
        });
      })();
    </script>
  </body>
</html>
