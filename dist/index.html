<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://bintahaassociates.github.io/bintaha-crm-v2/dist/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Bin Taha Associates — Executive CRM</title>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App Assets -->
    <script type="module" crossorigin src="./dist/assets/index-DEsWyKRV.js"></script>
    <link rel="stylesheet" crossorigin href="./dist/assets/index-BqdMV5Bv.css">

    <style>
      /* 3D Rotating Golden Eagle */
      @keyframes spinEagle3D {
        0% { transform: perspective(800px) rotateY(0deg); }
        50% { transform: perspective(800px) rotateY(180deg) scale(1.06); }
        100% { transform: perspective(800px) rotateY(360deg); }
      }

      .eagle-rotate-3d {
        height: 48px !important;
        width: auto !important;
        object-fit: contain !important;
        filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.8)) drop-shadow(0 4px 8px rgba(0,0,0,0.9)) !important;
        animation: spinEagle3D 7s infinite linear !important;
        transform-style: preserve-3d !important;
        display: inline-block !important;
        margin-right: 14px !important;
        flex-shrink: 0 !important;
      }

      /* Header Styling & Full Width Layout */
      header {
        background: radial-gradient(circle at top left, rgba(22, 22, 26, 0.98), rgba(10, 10, 12, 0.98)) !important;
        border-bottom: 1.5px solid rgba(212, 175, 55, 0.35) !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85) !important;
      }

      /* بٹنوں کو دائیں ہاتھ پر لاک کرنے کے رولز */
      header .max-w-7xl, header .max-w-6xl, header > div {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        width: 100% !important;
      }

      .brand-title-luxury {
        font-family: 'Cinzel', serif !important;
        background: linear-gradient(135deg, #FFF6C5 0%, #D4AF37 50%, #996D0F 100%) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        font-weight: 900 !important;
        font-size: 1.25rem !important;
        letter-spacing: 1.2px !important;
        white-space: nowrap !important;
      }

      /* Action Buttons Right Alignment */
      .header-actions-right {
        margin-left: auto !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 12px !important;
      }

      /* Top Developer Ribbon */
      #dev-status-ribbon {
        width: 100%;
        background: #08090d;
        border-bottom: 1px solid rgba(212, 175, 55, 0.25);
        padding: 7px 24px;
        font-size: 11.5px;
        color: #9ca3af;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
      }

      .pulse-green {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 8px #10b981;
        margin-right: 7px;
        animation: pulseDot 1.5s infinite;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }

      [class*="bg-surface"], .bg-surface-elevated, div[class*="rounded-xl"] {
        border: 1px solid rgba(212, 175, 55, 0.22) !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55) !important;
      }
    </style>
  </head>
  <body class="bg-[#08090c]">
    <!-- Top Secure Confidential Ribbon -->
    <div id="dev-status-ribbon">
      <div>
        <span class="pulse-green"></span>
        <b style="color: #f5d76e;">BIN TAHA WATCHDOG: ACTIVE</b>
        <span style="color: #4b5563; margin: 0 8px;">|</span>
        <span>Supabase Node AP-1: Connected</span>
      </div>
      <div>
        <span>Portfolio: <b style="color: #e5e7eb;">Strategic Land Bank (Master Vault)</b></span>
        <span style="color: #4b5563; margin: 0 8px;">|</span>
        <span style="color: #10b981; font-weight: 600;">Status: Confidential</span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        const SUPABASE_URL = "https://ajrvlrvnxpatbculnwil.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ndHx-NyVhYxvDwfvBnK2iA_woPQhjJi";
        const LOGO_URL = "https://bintahaassociates.github.io/bintaha-crm-v2/dist/logo.png";
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function formatHeaderLayout() {
          // 1. برانڈ سائیڈ
          const brandArea = document.querySelector('header a, nav a, header .flex.items-center:first-child');
          if (brandArea) {
            brandArea.style.display = 'inline-flex';
            brandArea.style.alignItems = 'center';
            brandArea.style.marginRight = 'auto';

            if (!brandArea.querySelector('.eagle-rotate-3d')) {
              const eagle = document.createElement('img');
              eagle.src = LOGO_URL;
              eagle.className = 'eagle-rotate-3d';
              eagle.alt = 'Bin Taha Associates';
              brandArea.prepend(eagle);
            }
          }

          // 2. بٹنوں کو دائیں جانب (Right Side) گروپ کرنا
          const calcBtn = document.querySelector('header button, nav button');
          if (calcBtn && calcBtn.parentElement) {
            calcBtn.parentElement.classList.add('header-actions-right');
            calcBtn.parentElement.style.marginLeft = 'auto';
            calcBtn.parentElement.style.display = 'inline-flex';
            calcBtn.parentElement.style.gap = '12px';
          }

          // 3. ٹائٹل گولڈ
          const titles = document.querySelectorAll('header span, header h1, header h2');
          titles.forEach(function(el) {
            if (el.textContent.includes('Bin Taha')) {
              el.className = 'brand-title-luxury';
            }
          });

          // 4. ماسٹر نیم
          const textNodes = document.querySelectorAll('h1, h2, span, p');
          textNodes.forEach(function(node) {
            if (node.textContent.includes('Fatima')) {
              node.textContent = node.textContent.replace(/Fatima/g, 'Taha Mobeen Bhutta');
            }
          });
        }

        async function logWatchdogSession() {
          if (!supabase) return;
          try {
            await supabase.from('watchdog_logs').insert([{
              device_info: navigator.userAgent,
              action_type: 'executive_session_active',
              details: {
                timestamp: new Date().toISOString(),
                page: window.location.href,
                status: 'Live Watchdog Session'
              }
            }]);
          } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', function() {
          formatHeaderLayout();
          setInterval(formatHeaderLayout, 300);
          logWatchdogSession();
        });
      })();
    </script>
  </body>
</html>
