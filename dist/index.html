<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://bintahaassociates.github.io/bintaha-crm-v2/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Bin Taha Associates — Elite Agent Portal & Watchdog</title>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App Assets -->
    <script type="module" crossorigin src="./assets/index-DEsWyKRV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BqdMV5Bv.css">

    <style>
      /* لگژری گولڈ برانڈنگ اور امبوس اسٹائلنگ */
      .brand-eagle-logo {
        height: 60px !important;
        width: auto !important;
        max-width: none !important;
        object-fit: contain !important;
        filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.45)) drop-shadow(0 2px 4px rgba(0,0,0,0.8)) !important;
        transition: transform 0.3s ease, filter 0.3s ease;
        display: inline-block !important;
      }
      .brand-eagle-logo:hover {
        transform: scale(1.06);
        filter: drop-shadow(0 0 16px rgba(245, 215, 110, 0.75)) !important;
      }
      .brand-title-gold {
        font-family: 'Cinzel', serif !important;
        background: linear-gradient(135deg, #FFF1B0 0%, #D4AF37 50%, #AA7C11 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800 !important;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
      }
      /* ہیڈر کی امیرانہ گلاس لک */
      header {
        background: linear-gradient(180deg, rgba(20, 20, 22, 0.95) 0%, rgba(12, 12, 14, 0.98) 100%) !important;
        border-bottom: 1px solid rgba(212, 175, 55, 0.25) !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6) !important;
        backdrop-filter: blur(10px) !important;
      }
      /* کارڈز اور ڈیش بورڈ پر گولڈن ایکسنٹ */
      .bg-surface-elevated, [class*="bg-surface"] {
        border: 1px solid rgba(212, 175, 55, 0.15) !important;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4) !important;
      }
    </style>
  </head>
  <body class="bg-[#0b0c0e]">
    <div id="root"></div>

    <script>
      (function() {
        const SUPABASE_URL = "https://ajrvlrvnxpatbculnwil.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ndHx-NyVhYxvDwfvBnK2iA_woPQhjJi";
        const LOGO_URL = "https://bintahaassociates.github.io/bintaha-crm-v2/logo.png";
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function upgradeBrandingLayout() {
          document.title = "Bin Taha Associates — Elite Portal";

          // مین ہیڈر برانڈ ایریا کو پکڑیں
          const brandArea = document.querySelector('header a, nav a, header .flex.items-center:first-child');
          if (brandArea && !brandArea.dataset.eagleMounted) {
            brandArea.style.display = 'flex';
            brandArea.style.alignItems = 'center';
            brandArea.style.overflow = 'visible';

            const oldSvg = brandArea.querySelector('svg');
            const oldImg = brandArea.querySelector('img');
            
            const eagleImg = document.createElement('img');
            eagleImg.src = LOGO_URL;
            eagleImg.className = 'brand-eagle-logo';
            eagleImg.alt = 'Bin Taha Associates';

            if (oldSvg) {
              oldSvg.parentNode.replaceChild(eagleImg, oldSvg);
            } else if (oldImg) {
              oldImg.parentNode.replaceChild(eagleImg, oldImg);
            } else {
              brandArea.prepend(eagleImg);
            }

            brandArea.dataset.eagleMounted = "true";
          }

          // فونٹس اور ناموں کو رائل گولڈ ٹچ دینا
          const logoTexts = document.querySelectorAll('header span, header h1, header h2');
          logoTexts.forEach(txt => {
            if (txt.textContent.includes('Bin Taha')) {
              txt.classList.add('brand-title-gold');
            }
          });

          const headings = document.querySelectorAll('h1, h2, span, p');
          headings.forEach(el => {
            if (el.textContent.includes('Fatima')) {
              el.textContent = el.textContent.replace(/Fatima/g, 'Taha Mobeen Bhutta');
            }
          });
        }

        // واچ ڈاگ ایکٹیویٹی لاگنگ
        async function logWatchdogActivity(actionType) {
          if (!supabase) return;
          try {
            await supabase.from('watchdog_logs').insert([{
              device_info: `${navigator.userAgent} | ${window.screen.width}x${window.screen.height}`,
              action_type: actionType,
              details: { timestamp: new Date().toISOString(), url: window.location.href }
            }]);
          } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
          setTimeout(upgradeBrandingLayout, 300);
          setInterval(upgradeBrandingLayout, 1200);
          logWatchdogActivity('portal_lux_load');
        });
      })();
    </script>
  </body>
</html>
