<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://bintahaassociates.github.io/bintaha-crm-v2/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Bin Taha Associates — Developer Portal</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" crossorigin src="./assets/index-DEsWyKRV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BqdMV5Bv.css">

    <style>
      /* 1. 3D 360-Degree Continuous Rotating Eagle */
      @keyframes spinEagle3D {
        0% { transform: perspective(800px) rotateY(0deg); }
        50% { transform: perspective(800px) rotateY(180deg) scale(1.08); }
        100% { transform: perspective(800px) rotateY(360deg); }
      }

      .eagle-rotate-3d {
        height: 68px !important;
        width: auto !important;
        object-fit: contain !important;
        filter: drop-shadow(0 0 16px rgba(234, 179, 8, 0.75)) drop-shadow(0 4px 10px rgba(0,0,0,0.9)) !important;
        animation: spinEagle3D 7s infinite linear !important;
        transform-style: preserve-3d !important;
        display: inline-block !important;
      }

      /* 2. Developer Luxury Styling & Glow */
      header {
        background: radial-gradient(circle at top left, rgba(28, 25, 23, 0.98), rgba(9, 9, 11, 0.98)) !important;
        border-bottom: 2px solid rgba(234, 179, 8, 0.35) !important;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85) !important;
      }

      /* Gold Luxury Brand Title */
      .brand-title-luxury {
        font-family: 'Cinzel', serif !important;
        background: linear-gradient(135deg, #FFF9D2 0%, #EAB308 50%, #92400E 100%) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        font-weight: 900 !important;
        font-size: 1.25rem !important;
        letter-spacing: 1.2px !important;
        text-shadow: 0 0 20px rgba(234, 179, 8, 0.3) !important;
      }

      /* Developer Live Status Ribbon */
      #dev-status-ribbon {
        width: 100%;
        background: linear-gradient(90deg, rgba(20, 20, 22, 0.95), rgba(30, 27, 20, 0.95), rgba(20, 20, 22, 0.95));
        border-bottom: 1px solid rgba(234, 179, 8, 0.3);
        padding: 7px 20px;
        font-size: 12px;
        color: #d1d5db;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
      }

      .pulse-green {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 10px #22c55e;
        margin-right: 8px;
        animation: pulseDot 1.5s infinite;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }

      /* Cards Glow Border */
      div[class*="rounded-xl"] {
        border: 1px solid rgba(234, 179, 8, 0.22) !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6) !important;
      }
    </style>
  </head>
  <body class="bg-[#090a0f]">
    <!-- Top Developer Live Telemetry Bar -->
    <div id="dev-status-ribbon">
      <div>
        <span class="pulse-green"></span>
        <b style="color: #fde047;">WATCHDOG CORE: LIVE</b>
        <span style="color: #4b5563; margin: 0 8px;">|</span>
        <span>Node: Supabase (Tokyo AP-1)</span>
      </div>
      <div>
        <span>Strategic Asset: <b style="color: #fde047;">870 Kanal Raiwind Rd Corridor</b></span>
        <span style="color: #4b5563; margin: 0 8px;">|</span>
        <span style="color: #22c55e; font-weight: 600;">Status: Secure Pipeline</span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        const SUPABASE_URL = "https://ajrvlrvnxpatbculnwil.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ndHx-NyVhYxvDwfvBnK2iA_woPQhjJi";
        const LOGO_URL = "https://bintahaassociates.github.io/bintaha-crm-v2/logo.png";
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function apply3DLayout() {
          // 1. Logo replace aur 3D animation lagana
          const headerContainer = document.querySelector('header a, nav a, header .flex.items-center:first-child');
          if (headerContainer && !headerContainer.dataset.eagleActive) {
            headerContainer.style.overflow = 'visible';

            const oldImages = headerContainer.querySelectorAll('img, svg');
            oldImages.forEach(el => el.remove());

            const rotatingEagle = document.createElement('img');
            rotatingEagle.src = LOGO_URL;
            rotatingEagle.className = 'eagle-rotate-3d';
            rotatingEagle.alt = 'Bin Taha Associates';

            headerContainer.prepend(rotatingEagle);
            headerContainer.dataset.eagleActive = "true";
          }

          // 2. Titles ko Luxury Gold Text dena
          const headers = document.querySelectorAll('header span, header h1, header h2');
          headers.forEach(el => {
            if (el.textContent.includes('Bin Taha')) {
              el.className = 'brand-title-luxury';
            }
          });

          // 3. Dummy Fatima ko badal kar Master Name rakhna
          const textNodes = document.querySelectorAll('h1, h2, span, p');
          textNodes.forEach(node => {
            if (node.textContent.includes('Fatima')) {
              node.textContent = node.textContent.replace(/Fatima/g, 'Taha Mobeen Bhutta');
            }
          });
        }

        // Supabase Watchdog Activity Log
        async function logWatchdog() {
          if (!supabase) return;
          try {
            await supabase.from('watchdog_logs').insert([{
              device_info: `${navigator.userAgent} | ${window.screen.width}x${window.screen.height}`,
              action_type: 'portal_3d_developer_active',
              details: { 
                timestamp: new Date().toISOString(),
                page: window.location.href
              }
            }]);
          } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
          setTimeout(apply3DLayout, 200);
          setInterval(apply3DLayout, 1000);
          logWatchdog();
        });
      })();
    </script>
  </body>
</html>
