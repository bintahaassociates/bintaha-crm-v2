<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://bintahaassociates.github.io/bintaha-crm-v2/dist/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Bin Taha Associates — Executive CRM</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" crossorigin src="./dist/assets/index-DEsWyKRV.js"></script>
    <link rel="stylesheet" crossorigin href="./dist/assets/index-BqdMV5Bv.css">

    <style>
      /* 3D 360-Degree Continuous Rotating Golden Eagle */
      @keyframes spinEagle3D {
        0% { transform: perspective(800px) rotateY(0deg); }
        50% { transform: perspective(800px) rotateY(180deg) scale(1.06); }
        100% { transform: perspective(800px) rotateY(360deg); }
      }

      .eagle-rotate-3d {
        height: 52px !important;
        width: auto !important;
        object-fit: contain !important;
        filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.8)) drop-shadow(0 4px 8px rgba(0,0,0,0.9)) !important;
        animation: spinEagle3D 7s infinite linear !important;
        transform-style: preserve-3d !important;
        display: inline-block !important;
        margin-right: 14px !important;
        flex-shrink: 0 !important;
      }

      /* Header Flex Alignment Fix */
      header > div, nav > div {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        width: 100% !important;
      }

      header {
        background: radial-gradient(circle at top left, rgba(22, 22, 26, 0.98), rgba(10, 10, 12, 0.98)) !important;
        border-bottom: 1.5px solid rgba(212, 175, 55, 0.35) !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85) !important;
      }

      .brand-title-luxury {
        font-family: 'Cinzel', serif !important;
        background: linear-gradient(135deg, #FFF6C5 0%, #D4AF37 50%, #996D0F 100%) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        font-weight: 900 !important;
        font-size: 1.25rem !important;
        letter-spacing: 1.2px !important;
        white-space: nowrap !important;
      }

      /* Developer Status Bar */
      #dev-status-ribbon {
        width: 100%;
        background: #08090d;
        border-bottom: 1px solid rgba(212, 175, 55, 0.25);
        padding: 7px 24px;
        font-size: 11.5px;
        color: #9ca3af;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
      }

      .pulse-green {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 8px #10b981;
        margin-right: 7px;
        animation: pulseDot 1.5s infinite;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }

      /* Dashboard Action Buttons Fix */
      header button, nav button {
        margin-left: 8px !important;
      }
    </style>
  </head>
  <body class="bg-[#08090c]">
    <!-- Top Secure Confidential Ribbon -->
    <div id="dev-status-ribbon">
      <div>
        <span class="pulse-green"></span>
        <b style="color: #f5d76e;">BIN TAHA WATCHDOG: ACTIVE</b>
        <span style="color: #4b5563; margin: 0 8px;">|</span>
        <span>Secure Protocol: Encrypted Node AP-1</span>
      </div>
      <div>
        <span>Portfolio: <b style="color: #e5e7eb;">Strategic Land Bank (Master Vault)</b></span>
        <span style="color: #4b5563; margin: 0 8px;">|</span>
        <span style="color: #10b981; font-weight: 600;">Status: Confidential</span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        const SUPABASE_URL = "https://ajrvlrvnxpatbculnwil.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ndHx-NyVhYxvDwfvBnK2iA_woPQhjJi";
        const LOGO_URL = "https://bintahaassociates.github.io/bintaha-crm-v2/dist/logo.png";
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function alignExecutiveUI() {
          // 1. Header Layout Alignment
          const headerNav = document.querySelector('header, nav');
          if (headerNav) {
            const innerFlex = headerNav.querySelector('.flex.items-center.justify-between, .flex.justify-between');
            if (innerFlex) {
              innerFlex.style.width = '100%';
              innerFlex.style.display = 'flex';
              innerFlex.style.justifyContent = 'space-between';
              innerFlex.style.alignItems = 'center';
            }
          }

          // 2. Logo & Brand Lockup
          const brandLink = document.querySelector('header a, nav a, header .flex.items-center:first-child');
          if (brandLink) {
            brandLink.style.display = 'inline-flex';
            brandLink.style.alignItems = 'center';
            brandLink.style.marginRight = 'auto';

            // Unwanted overlapping boxes remove karna
            const redundantItems = brandLink.querySelectorAll('svg, img:not(.eagle-rotate-3d)');
            redundantItems.forEach(el => el.remove());

            if (!brandLink.querySelector('.eagle-rotate-3d')) {
              const eagle = document.createElement('img');
              eagle.src = LOGO_URL;
              eagle.className = 'eagle-rotate-3d';
              eagle.alt = 'Bin Taha Associates';
              brandLink.prepend(eagle);
            }
          }

          // 3. Gold Typography
          const titles = document.querySelectorAll('header span, header h1, header h2');
          titles.forEach(el => {
            if (el.textContent.includes('Bin Taha')) {
              el.className = 'brand-title-luxury';
            }
          });

          // 4. Personalized Master Name Check
          const textNodes = document.querySelectorAll('h1, h2, span, p');
          textNodes.forEach(node => {
            if (node.textContent.includes('Fatima')) {
              node.textContent = node.textContent.replace(/Fatima/g, 'Taha Mobeen Bhutta');
            }
          });
        }

        // Supabase Activity Logger
        async function logWatchdog() {
          if (!supabase) return;
          try {
            await supabase.from('watchdog_logs').insert([{
              device_info: navigator.userAgent,
              action_type: 'executive_session_active',
              details: { 
                timestamp: new Date().toISOString(),
                page: window.location.href,
                status: 'Confidential Access'
              }
            }]);
          } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
          alignExecutiveUI();
          setInterval(alignExecutiveUI, 500);
          logWatchdog();
        });
      })();
    </script>
  </body>
</html>
